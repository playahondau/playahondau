<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Universitario – Noticias Playa Honda Universitario</title>
<meta name="description" content="El Universitario, el diario de Playa Honda Universitario. Últimos resultados, crónicas y novedades del club en la Liga Universitaria del Uruguay." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://playahondau.com/newsletter.html" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{margin:0;background:#1a3a8f;font-family:'Hanken Grotesk',Helvetica,sans-serif;color:#f4f6fc;}
a{color:#fff;}

#diario{padding:3rem 1.25rem 4rem;}
.dr-wrap{max-width:1040px;margin:0 auto;}

/* ── Cabecera ── */
.dr-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem 1.5rem;padding-bottom:1.75rem;border-bottom:1px solid rgba(255,255,255,.22);}
.dr-top img{width:56px;height:56px;object-fit:contain;display:block;}
.dr-title{flex:1 1 320px;text-align:center;}
.dr-name{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(2.4rem,7vw,4rem);line-height:1;letter-spacing:.01em;color:#fff;}
.dr-tagline{margin-top:.65rem;font-size:.68rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.7);}
.dr-meta{width:56px;flex:0 0 auto;text-align:right;font-size:.68rem;line-height:1.5;color:rgba(255,255,255,.7);}

/* ── Aviso ── */
.dr-promo{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5rem 1.5rem;padding:1rem 0;border-bottom:1px solid rgba(255,255,255,.22);}
.dr-promo-t{font-size:.88rem;font-weight:300;color:rgba(255,255,255,.85);}
.dr-promo-btn{font-size:.72rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:#fff;border-bottom:1px solid #fff;padding-bottom:2px;}
.dr-promo-btn:hover{color:#cfd9f5;border-color:#cfd9f5;}

/* ── Columnas ── */
.dr-results-grid{display:flex;flex-wrap:wrap;gap:3rem 4.5rem;padding-top:2.5rem;}
.dr-results-grid>div{flex:1 1 420px;min-width:0;}
.dr-sh{margin-bottom:.5rem;font-size:.68rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.7);}
.dr-cron{padding-top:2.5rem;max-width:680px;font-family:'Instrument Serif',Georgia,serif;font-size:1.15rem;line-height:1.6;color:rgba(255,255,255,.85);}

/* ── Partidos ── */
.dr-card{padding:1.25rem 0;border-top:1px solid rgba(255,255,255,.14);}
.dr-cat{display:flex;justify-content:space-between;gap:.75rem;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7);}
.dr-cat span+span{letter-spacing:.04em;text-transform:none;text-align:right;}
.dr-line{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin-top:.65rem;font-size:1.05rem;font-weight:500;}
.dr-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
.dr-score{font-weight:600;font-variant-numeric:tabular-nums;}
.dr-vs{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:1rem;font-weight:400;color:rgba(255,255,255,.7);}
.dr-crest{width:24px;height:24px;object-fit:contain;flex:0 0 auto;}
.dr-crest.rv{background:#fff;border-radius:50%;padding:2px;}
.dr-ini{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.22);border-radius:50%;font-size:.55rem;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:0;}
.dr-sub{margin-top:.5rem;font-size:.82rem;font-weight:300;color:rgba(255,255,255,.7);}
.dr-win{color:#7be0a4;}.dr-loss{color:#ff9a93;}.dr-draw{color:#f2c25c;}
.dr-dot.dr-win{background:#7be0a4;}.dr-dot.dr-loss{background:#ff9a93;}.dr-dot.dr-draw{background:#f2c25c;}

.dr-foot{margin-top:3.5rem;padding-top:1.25rem;border-top:1px solid rgba(255,255,255,.22);text-align:center;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.7);}
</style>
</head>

<body>

<section id="diario">
  <div class="dr-wrap" id="diario-inner">
    <p style="text-align:center;font-family:'Barlow Condensed',sans-serif;color:#888;letter-spacing:.15em;font-size:.8rem;">Cargando edición&hellip;</p>
  </div>
</section>

<script>
// CSV de la sheet de resultados (todas las columnas, incluyendo "cronica" en L)
var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRk1EbUsbN8nC4fWhW0-Q9jhHuM-BY7DN6kRyPL3unosT2p8JVK2Y7IJjhPBRSBySbbKvy6es_0wJ5L/pub?gid=0&single=true&output=csv";

// Apps Script (mismo proxy que usa index.html): fixture + escudos de equipos
var API_URL = "https://script.google.com/macros/s/AKfycbx2jJEMPX61o-6xApVvZIgVD8LISORPDXSbLvsnAretYmdsk7dHxpYvNEco_Oa8_X2P/exec";

// Parser de CSV que respeta campos entre comillas (por si la crónica tiene comas)
function parseCSVRow(row) {
  var cols = [], cur = '', inQ = false;
  for (var i = 0; i < row.length; i++) {
    var c = row[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { cols.push(cur); cur = ''; }
    else { cur += c; }
  }
  cols.push(cur);
  return cols;
}

// ── Escudos de equipos (matching por nombre, la sheet los escribe a mano y varían) ──
var TEAM_LOGOS = [];   // [{name, logo_url}] tal cual vienen de lud-backend

function normalize(s) {
  return (s || '').toUpperCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^A-Z0-9]+/g, ' ').trim();
}
function compact(s) { return normalize(s).replace(/\s+/g, ''); }

// Rivales que se tipean abreviados a mano en la sheet y son ambiguos por token
// (ej. "Seminario" matchea CLUB SEMINARIO / SEMINARIO 08 / SEMINARIO UNIVERSITARIO).
// Mapea el nombre normalizado completo al nombre exacto del equipo en lud-backend.
var EXACT_ALIASES = {
  'SEMINARIO':      'CLUB SEMINARIO',
  'JESUS MARIA':    'CLUB JESUS MARIA',
  'SAN JUAN':       'SAN JUAN BAUTISTA',
  'OCC':            'OLD CHRISTIANS CLUB',
  'OCC AZUL':       'OLD CHRISTIANS AZUL',
  'WOODLANDS':      'OLD WOODLANDS CLUB'
};

function findLogo(rivalName) {
  if (!rivalName || !TEAM_LOGOS.length) return '';
  var normRival = normalize(rivalName);
  var compRival = normRival.replace(/\s+/g, '');

  if (EXACT_ALIASES[normRival]) {
    var compAlias = compact(EXACT_ALIASES[normRival]);
    for (var j = 0; j < TEAM_LOGOS.length; j++) {
      if (compact(TEAM_LOGOS[j].name) === compAlias) return TEAM_LOGOS[j].logo_url;
    }
  }

  var rivalTokens = normRival.split(' ').filter(Boolean);
  var best = null, bestScore = 0, bestExtra = Infinity;
  for (var i = 0; i < TEAM_LOGOS.length; i++) {
    var t = TEAM_LOGOS[i];
    if (compact(t.name) === compRival) return t.logo_url;           // match exacto
    var teamTokens = normalize(t.name).split(' ').filter(Boolean);
    var overlap = rivalTokens.filter(function(tok){ return teamTokens.indexOf(tok) !== -1; }).length;
    var extra = teamTokens.length - overlap;                        // tokens del equipo que no matchean
    if (overlap > 0 && (overlap > bestScore || (overlap === bestScore && extra < bestExtra))) {
      bestScore = overlap; bestExtra = extra; best = t.logo_url;
    }
  }
  return best || '';
}

Promise.all([
  fetch(CSV_URL).then(function(r){ return r.text(); }),
  fetch(API_URL).then(function(r){ return r.json(); }).catch(function(){ return {}; }),
  fetch(API_URL + '?view=teams').then(function(r){ return r.json(); }).catch(function(){ return []; })
])
.then(function(res) {
  var csvText = res[0];
  var apiData = res[1];
  TEAM_LOGOS = Array.isArray(res[2]) ? res[2] : [];

  // Parsear resultados del CSV
  var rows = csvText.split('\n').slice(1);
  var resultados = [];
  rows.forEach(function(row) {
    if (!row.trim()) return;
    var c = parseCSVRow(row);
    // Columnas: A=categoria B=rival C=score D=estado E=localia F=dia G=fecha H=goleadores ... L(11)=cronica
    resultados.push({
      categoria:  (c[0]||'').trim(),
      rival:      (c[1]||'').trim(),
      score:      (c[2]||'').trim(),
      estado:     (c[3]||'').trim().toLowerCase(),
      localia:    (c[4]||'').trim(),
      dia:        (c[5]||'').trim(),
      fecha:      (c[6]||'').trim(),
      goleadores: (c[7]||'').trim(),
      cronica:    (c[11]||'').trim()   // columna L
    });
  });

  // Master no está en lud-backend: se carga a mano acá, igual que en index.html. Actualizar cada fecha.
  var MANUAL_FIXTURE = [
    { categoria:'Master', local:'Playa Honda', visitante:'Adiós Juventud',
      dia_hora:'Hoy', lugar:'Local · Santa Rita' },
    { categoria:'Sub 18', local:'Playa Honda', visitante:'Náutico',
      dia_hora:'Dom 25 oct. · 15:30h', lugar:'Visita · Náutico' }
  ];
  var fixture = MANUAL_FIXTURE.concat((apiData.fixture || []).filter(function(f){
    return !MANUAL_FIXTURE.some(function(m){ return m.categoria === f.categoria; });
  }));
  // Hora/cancha que lud-backend no tiene cargadas. Actualizar cada fecha.
  fixture.forEach(function(f) {
    if (f.categoria === 'Mayor' && /SANTA ELENA/i.test(f.local + f.visitante)) {
      if (f.dia_hora.indexOf(' · ') === -1) f.dia_hora += ' · 11:15h';
      if (!f.lugar) f.lugar = 'Arrayanes';
    }
  });
  // Goleadores que faltan en la sheet
  resultados.forEach(function(rv) {
    if (rv.categoria === 'Sub 18' && !rv.goleadores && /^4\/10/.test(rv.dia)) rv.goleadores = 'Pedro Mascaró';
  });
  renderDiario(resultados, fixture);
})
.catch(function(){
  document.getElementById('diario-inner').innerHTML =
    '<p style="text-align:center;color:#888;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.1em;">No se pudo cargar el diario.</p>';
});

function renderDiario(resultados, fixture) {
  var sec = document.getElementById('diario-inner');
  if (!sec || !resultados || !resultados.length) { sec.innerHTML = ''; return; }

  var ahora   = new Date();
  var diasSem = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var mesesN  = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var fechaStr = diasSem[ahora.getDay()]+' '+ahora.getDate()+' de '+mesesN[ahora.getMonth()]+' de '+ahora.getFullYear();
  var edicion  = Math.floor(Math.random()*80+40);

  var r   = resultados[0];
  var res = r.estado;           // victoria | empate | derrota
  var rival = r.rival;
  var sc    = r.score;
  var cat   = r.categoria;

  var TIT = {
    victoria:[
      'GRAN FINDE AZUL. EL PLAYA RESPONDE CON FUERZA.',
      'PLAYA HONDA APLASTA A '+rival.toUpperCase()+' CON UN CONTUNDENTE '+sc,
      'NOCHE AZUL EN '+cat.toUpperCase()+': VICTORIA HISTÓRICA DE LOS UNIVERSITARIOS',
      'IMPARABLES: LOS AZULES SE IMPONEN '+sc+' Y SIGUEN SOÑANDO'
    ],
    empate:[
      'FINDE PAREJO. EL PLAYA SUMA Y SIGUE.',
      'SE REPARTEN LOS PUNTOS: PLAYA HONDA Y '+rival.toUpperCase()+' IGUALAN '+sc,
      'NI VENCEDORES NI VENCIDOS: EMPATE JUSTO EN '+cat.toUpperCase()
    ],
    derrota:[
      'DURA FECHA. A PREPARAR LO QUE SE VIENE.',
      'GOLPE DURO: PLAYA HONDA CAE ANTE '+rival.toUpperCase()+' POR '+sc,
      'TROPIEZO AZUL QUE DUELE EN '+cat.toUpperCase()
    ]
  };
  var SUB = {
    victoria:['Jornada positiva para el Playa. A mantener el nivel el finde que viene.','Los azules demostraron carácter y se llevaron los tres puntos.','Playa Honda sumó de a tres y sigue en la pelea por los primeros puestos.'],
    empate:['Jornada con luces y sombras. A cerrar mejor el finde que viene.','Un punto que puede valer mucho en el balance final de la temporada.'],
    derrota:['Jornada complicada para el Playa. A pensar en el finde que viene.','Los universitarios deberán reponerse de cara a la próxima fecha.']
  };
  var CRON = {
    victoria:['Desde el primer silbato Playa Honda mostró intensidad. Los azules cerraron bien los espacios atrás y fueron peligrosos en ataque, con una ventaja que reflejan los números: '+sc+'. Tres puntos vitales para la campaña universitaria.','Un partido para enmarcar. Playa Honda manejó los tiempos con inteligencia, sostuvo la presión y terminó siendo justo vencedor. El '+sc+' es elocuente.'],
    empate:['Un partido parejo de principio a fin. Playa Honda mostró solvencia defensiva y generó situaciones, aunque el gol no llegó a más. El punto suma y el equipo sigue en carrera.'],
    derrota:['La derrota duele pero no define. Playa Honda compitió, tuvo momentos, pero el rival fue más efectivo. Ahora toca reponerse y pensar en la próxima fecha con la cabeza alta.']
  };

  var arr     = TIT[res] || TIT.derrota;
  var titular = 'RESULTADOS DEL FINDE';
  var sarr    = SUB[res] || SUB.derrota;
  var subtit  = '';
  var carr    = CRON[res] || CRON.derrota;

  // Si escribiste la crónica en la columna L del sheet, se usa esa. Si no, sin crónica.
  var cronica    = r.cronica || '';
  var hasCronica = !!cronica;

  // Parsea "Visita- Arrayanes" → { lado: "Visita", cancha: "Arrayanes" }
  function parseLoc(loc) {
    var parts = loc.split('-');
    return {
      lado:   parts[0].trim(),
      cancha: parts.slice(1).join('-').trim()
    };
  }

  function crest(name) {
    if (/playa honda/i.test(name)) return '<img class="dr-crest" src="escudo-transparente.png" alt="">';
    if (/adi[oó]s juventud/i.test(name)) return '';
    var u = findLogo(name);
    if (u) return '<img class="dr-crest rv" src="'+u+'" alt="">';
    var ini = name.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase();}).join('');
    return '<span class="dr-crest dr-ini" aria-hidden="true">'+ini+'</span>';
  }

  var resHtml = resultados.filter(function(rv){ return rv.score && rv.rival; }).slice(0,6).map(function(rv) {
    var k   = rv.estado==='victoria'?'dr-win':rv.estado==='empate'?'dr-draw':'dr-loss';
    var loc = parseLoc(rv.localia);
    var golesHtml = rv.goleadores
      ? '<div class="dr-sub">'+rv.goleadores.split(';').map(function(g){return g.trim();}).join(' &nbsp;·&nbsp; ')+'</div>'
      : '';
    return '<article class="dr-card">'+
      '<div class="dr-cat"><span>'+rv.categoria+'</span><span>'+rv.dia+' &middot; '+rv.fecha+' &middot; '+loc.lado+(loc.cancha?' &middot; '+loc.cancha:'')+'</span></div>'+
      '<div class="dr-line"><span class="dr-dot '+k+'"></span>'+crest('Playa Honda')+'<span>Playa Honda</span><span class="dr-score '+k+'">'+rv.score.replace('-','–')+'</span><span>'+rv.rival+'</span>'+crest(rv.rival)+'</div>'+
      golesHtml+
    '</article>';
  }).join('');

  var fixHtml = (fixture.length
    ? fixture.filter(function(f){ return f.local && f.visitante; }).slice(0,6).map(function(f) {
        return '<article class="dr-card">'+
          '<div class="dr-cat"><span>'+f.categoria+'</span></div>'+
          '<div class="dr-line">'+crest(f.local)+'<span>'+f.local+'</span><span class="dr-vs">vs</span>'+crest(f.visitante)+'<span>'+f.visitante+'</span></div>'+
          '<div class="dr-sub">'+f.dia_hora+(f.lugar?' &middot; '+f.lugar:'')+'</div>'+
        '</article>';
      }).join('')
    : '<p class="dr-sub">Sin fixture disponible.</p>'
  );

  var cols =
    '<div class="dr-results-grid">'+
      '<div><h4 class="dr-sh">Últimos partidos</h4>'+resHtml+'</div>'+
      '<div><h4 class="dr-sh">Pr&oacute;ximos partidos</h4>'+fixHtml+'</div>'+
    '</div>';

  sec.innerHTML =
    '<div class="dr-top">'+
      '<img src="escudo-transparente.png" alt="Escudo">'+
      '<div class="dr-title"><h2 class="dr-name">Finde del Playa</h2>'+
        '<p class="dr-tagline">Liga Universitaria del Uruguay &middot; desde 1964</p></div>'+
      '<span class="dr-meta">'+diasSem[ahora.getDay()].slice(0,3)+'<br>'+ahora.getDate()+' '+mesesN[ahora.getMonth()].slice(0,3)+'</span>'+
    '</div>'+
    '<div class="dr-promo">'+
      '<p class="dr-promo-t">Los rivales de este finde y sus datos estarán publicados mañana.</p>'+
      '<a class="dr-promo-btn" href="analisis.html">Ver datos de rivales &rarr;</a>'+
    '</div>'+
    (hasCronica ? '<p class="dr-cron">'+cronica+'</p>' : '')+
    cols+
    '<div class="dr-foot">Playa Honda Universitario &middot; playahondau.com</div>';
}
</script>

</body>
</html>
