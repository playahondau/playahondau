<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llegué — Panel de anfitriones</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --azul: #1a3a8f; --azul-claro: #2f57c9; --dorado: #d4af37; --fondo: #0b0f1a;
    --panel: #131a2b; --panel2: #0d1322; --texto: #e8ecf5; --verde: #2ecc71; --rojo: #e74c3c;
    --linea: #24304a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--fondo), #060810);
    color: var(--texto); min-height: 100vh; padding: 20px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .topbar a { color: #8a94b3; text-decoration: none; font-size: 0.85rem; }
  .conn-status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #8a94b3; }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #666; transition: background 0.3s; }
  .conn-dot.ok { background: var(--verde); box-shadow: 0 0 6px var(--verde); }
  .conn-dot.err { background: var(--rojo); }

  h1 { font-size: 1.5rem; text-align: center; margin: 4px 0 2px; color: var(--dorado); }
  p.subtitle { text-align: center; color: #9aa5c0; margin: 0 0 20px; font-size: 0.92rem; }

  /* Hero de estado */
  .hero {
    border-radius: 18px; padding: 26px 20px; text-align: center; margin-bottom: 18px;
    transition: background 0.4s, border-color 0.4s;
    border: 1px solid var(--linea); background: var(--panel);
  }
  .hero.calm { background: linear-gradient(160deg, #12291d, #0d1322); border-color: #1c4430; }
  .hero.alert { background: linear-gradient(160deg, #3a1414, #0d1322); border-color: #6b2020; animation: heroPulse 1.4s infinite; }
  @keyframes heroPulse { 0%,100% { box-shadow: 0 0 0 rgba(231,76,60,0); } 50% { box-shadow: 0 0 24px rgba(231,76,60,0.35); } }
  .hero .icon { font-size: 2.6rem; margin-bottom: 6px; }
  .hero.alert .icon { animation: shake 0.6s infinite; }
  @keyframes shake { 0%,100% { transform: rotate(0);} 25% { transform: rotate(-12deg);} 75% { transform: rotate(12deg);} }
  .hero .title { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
  .hero.calm .title { color: var(--verde); }
  .hero.alert .title { color: #ff8a80; }
  .hero .desc { color: #b7c0d8; font-size: 0.9rem; }
  .hero button { margin-top: 16px; }

  .card { background: var(--panel); border: 1px solid var(--linea); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 0.85rem; margin: 0 0 12px; color: var(--dorado); text-transform: uppercase; letter-spacing: 0.06em; }
  label { display: block; font-size: 0.85rem; color: #b7c0d8; margin-bottom: 6px; }
  input[type="text"] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c3a5c; background: var(--panel2); color: var(--texto); font-size: 0.95rem; }
  button { font-family: inherit; font-weight: 600; border: none; border-radius: 10px; padding: 12px 16px; font-size: 0.95rem; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--azul); color: #fff; }
  .btn-primary:hover { background: var(--azul-claro); }
  .btn-secondary { background: transparent; color: var(--dorado); border: 1px solid var(--dorado); }
  .full { width: 100%; }
  .save-row { display: flex; gap: 10px; margin-top: 4px; }
  .save-row button { flex-shrink: 0; }
  .saved-msg { font-size: 0.85rem; color: var(--verde); margin-top: 10px; display: none; }

  .section-label { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 10px; }
  .section-label h3 { font-size: 0.8rem; color: #8a94b3; text-transform: uppercase; letter-spacing: 0.06em; margin: 0; font-weight: 600; }
  .count-pill { font-size: 0.72rem; background: var(--linea); color: #b7c0d8; padding: 2px 9px; border-radius: 999px; }

  .arrival {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 13px 14px; border-radius: 12px; background: var(--panel2); margin-bottom: 8px; border: 1px solid #1b2438;
  }
  .arrival.is-waiting { border-color: #5c3a12; background: linear-gradient(90deg, #241a0d, var(--panel2)); }
  .arrival .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--linea); display: flex;
    align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
  }
  .arrival.is-waiting .avatar { background: #4a3a12; }
  .arrival .body { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .arrival .info { font-size: 0.9rem; min-width: 0; }
  .arrival .info .name { font-weight: 600; }
  .arrival .info .t { color: #8a94b3; font-size: 0.76rem; }
  .badge { font-size: 0.72rem; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.waiting { background: #4a3a12; color: #f5c542; }
  .badge.assigned { background: #123a2a; color: var(--verde); }
  .badge.attended { background: var(--linea); color: #9aa5c0; }
  .btn-mini { padding: 8px 12px; font-size: 0.8rem; border-radius: 8px; border: none; cursor: pointer; flex-shrink: 0; }
  .btn-mini.go { background: var(--verde); color: #06210f; }
  .btn-mini.done { background: var(--linea); color: var(--texto); }
  .empty { text-align: center; color: #6b7590; padding: 20px 0; font-size: 0.88rem; }
  details.history summary { cursor: pointer; color: #8a94b3; font-size: 0.85rem; list-style: none; display: flex; align-items: center; gap: 6px; }
  details.history summary::-webkit-details-marker { display: none; }
  details.history summary::before { content: '▸'; transition: transform 0.2s; }
  details.history[open] summary::before { transform: rotate(90deg); }
  details.history { margin-top: 4px; }

  /* Alerta de pantalla completa */
  #overlay {
    position: fixed; inset: 0; background: rgba(11,15,26,0.97);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; padding: 24px; text-align: center;
    animation: pulse-bg 1.2s infinite;
  }
  @keyframes pulse-bg { 0%,100% { background: rgba(11,15,26,0.97);} 50% { background: rgba(40,10,10,0.97);} }
  #overlay .bell { font-size: 4.5rem; margin-bottom: 14px; animation: shake 0.6s infinite; }
  #overlay h2 { font-size: 1.9rem; color: #fff; margin: 0 0 8px; }
  #overlay p { color: #cbd2e5; margin: 0 0 30px; }
  #overlay button { width: 100%; max-width: 320px; padding: 18px; font-size: 1.1rem; border-radius: 12px; margin-bottom: 12px; }
  #overlay .btn-go { background: var(--verde); color: #06210f; }
  #overlay .btn-ignore { background: transparent; color: #8a94b3; border: 1px solid #3a4463; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html">← Escucha</a>
    <span class="conn-status"><span class="conn-dot" id="connDot"></span><span id="connText">Conectando…</span></span>
  </div>
  <h1>🏠 Panel de anfitriones</h1>
  <p class="subtitle">Acá coordinan quién abre cuando alguien toca el timbre.</p>

  <div class="hero calm" id="hero">
    <div class="icon" id="heroIcon">✅</div>
    <div class="title" id="heroTitle">Todo tranquilo</div>
    <div class="desc" id="heroDesc">Nadie está esperando en la puerta.</div>
  </div>

  <div class="card">
    <h2>Tu nombre</h2>
    <div class="save-row">
      <input type="text" id="hostName" placeholder="ej: Francisco">
      <button class="btn-primary" id="saveName">Guardar</button>
    </div>
    <div class="saved-msg" id="savedMsg">✅ Guardado. Ya podés esperar avisos.</div>
  </div>

  <div class="section-label">
    <h3>Esperando ahora</h3>
    <span class="count-pill" id="waitingCount">0</span>
  </div>
  <div id="waitingList"><div class="empty">Nadie está esperando.</div></div>

  <details class="history">
    <summary>Historial reciente (<span id="historyCount">0</span>)</summary>
    <div id="historyList" style="margin-top:10px"></div>
  </details>
</div>

<div id="overlay">
  <div class="bell">🔔</div>
  <h2>¡Tocaron el timbre!</h2>
  <p id="overlayTime"></p>
  <button class="btn-go" id="overlayGo">VOY YO</button>
  <button class="btn-ignore" id="overlayIgnore">Ignorar</button>
</div>

<script>
const hostNameInput = document.getElementById('hostName');
const saveNameBtn = document.getElementById('saveName');
const savedMsg = document.getElementById('savedMsg');
const hero = document.getElementById('hero');
const heroIcon = document.getElementById('heroIcon');
const heroTitle = document.getElementById('heroTitle');
const heroDesc = document.getElementById('heroDesc');
const waitingList = document.getElementById('waitingList');
const waitingCount = document.getElementById('waitingCount');
const historyList = document.getElementById('historyList');
const historyCount = document.getElementById('historyCount');
const overlay = document.getElementById('overlay');
const overlayTime = document.getElementById('overlayTime');
const overlayGo = document.getElementById('overlayGo');
const overlayIgnore = document.getElementById('overlayIgnore');
const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');

const HOST_KEY = 'llegue-host-name';
hostNameInput.value = localStorage.getItem(HOST_KEY) || '';
if (hostNameInput.value) { savedMsg.style.display = 'block'; }

saveNameBtn.addEventListener('click', () => {
  const name = hostNameInput.value.trim();
  if (!name) { hostNameInput.focus(); return; }
  localStorage.setItem(HOST_KEY, name);
  savedMsg.style.display = 'block';
});
hostNameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') saveNameBtn.click();
});

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
}
function elapsed(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return 'recién';
  if (mins < 60) return `hace ${mins} min`;
  return `hace ${Math.floor(mins / 60)} h`;
}

if (LLEGUE_CONFIG.firebase.apiKey === 'PEGAR_ACA') {
  waitingList.innerHTML = '<div class="empty">Falta configurar Firebase en config.js para que funcione el tiempo real.</div>';
  connText.textContent = 'Sin configurar';
  connDot.classList.add('err');
} else {
  firebase.initializeApp(LLEGUE_CONFIG.firebase);
  const db = firebase.database();
  const ref = db.ref('arrivals').limitToLast(30);

  db.ref('.info/connected').on('value', snap => {
    if (snap.val() === true) {
      connDot.classList.add('ok');
      connDot.classList.remove('err');
      connText.textContent = 'Conectado en tiempo real';
    } else {
      connDot.classList.remove('ok');
      connText.textContent = 'Conectando…';
    }
  });

  let ignoredIds = new Set();
  let overlayCurrentId = null;
  let alertInterval = null;
  let lastList = [];

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.15;
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      setTimeout(() => { osc.stop(); ctx.close(); }, 350);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  }

  function assign(id) {
    const hostName = hostNameInput.value.trim() || 'Alguien';
    db.ref(`arrivals/${id}`).transaction(current => {
      if (current && current.status === 'waiting') {
        current.status = 'assigned';
        current.assignedHost = hostName;
        current.assignedAt = Date.now();
        return current;
      }
      return; // aborta si ya fue asignado por otro anfitrión
    });
  }

  function markAttended(id) {
    db.ref(`arrivals/${id}`).update({ status: 'attended', attendedAt: Date.now() });
  }

  overlayGo.addEventListener('click', () => {
    if (overlayCurrentId) assign(overlayCurrentId);
    hideOverlay();
  });
  overlayIgnore.addEventListener('click', () => {
    if (overlayCurrentId) ignoredIds.add(overlayCurrentId);
    hideOverlay();
  });

  function hideOverlay() {
    overlay.style.display = 'none';
    overlayCurrentId = null;
    if (alertInterval) { clearInterval(alertInterval); alertInterval = null; }
  }

  function showOverlay(id, createdAt) {
    if (overlayCurrentId === id) return;
    overlayCurrentId = id;
    overlayTime.textContent = `Sonó a las ${fmtTime(createdAt)}`;
    overlay.style.display = 'flex';
    beep();
    alertInterval = setInterval(beep, 4000);
  }

  function arrivalCard(a) {
    const isWaiting = a.status === 'waiting';
    const badge = a.status === 'waiting'
      ? '<span class="badge waiting">esperando</span>'
      : a.status === 'assigned'
        ? `<span class="badge assigned">${a.assignedHost} va</span>`
        : '<span class="badge attended">atendido</span>';
    const actions = a.status === 'waiting'
      ? `<button class="btn-mini go" onclick="window.__assign('${a.id}')">VOY YO</button>`
      : a.status === 'assigned'
        ? `<button class="btn-mini done" onclick="window.__attend('${a.id}')">Ya fue atendido</button>`
        : '';
    return `<div class="arrival ${isWaiting ? 'is-waiting' : ''}">
      <div class="body">
        <div class="avatar">🔔</div>
        <div class="info">
          <div class="name">${a.name}</div>
          <span class="t">${fmtTime(a.createdAt)} · ${elapsed(a.createdAt)}</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">${badge}${actions}</div>
    </div>`;
  }

  function render() {
    const list = lastList;
    const waiting = list.filter(a => a.status === 'waiting');
    const rest = list.filter(a => a.status !== 'waiting');

    waitingCount.textContent = waiting.length;
    historyCount.textContent = rest.length;

    waitingList.innerHTML = waiting.length
      ? waiting.map(arrivalCard).join('')
      : '<div class="empty">Nadie está esperando.</div>';

    historyList.innerHTML = rest.length
      ? rest.slice(0, 15).map(arrivalCard).join('')
      : '<div class="empty">Todavía no hay historial.</div>';

    if (waiting.length > 0) {
      hero.className = 'hero alert';
      heroIcon.textContent = '🔔';
      heroTitle.textContent = waiting.length === 1 ? '¡Alguien está en la puerta!' : `¡${waiting.length} avisos esperando!`;
      heroDesc.textContent = `Sonó ${elapsed(waiting[0].createdAt)}. Tocá "Voy yo" en la lista de abajo.`;
    } else {
      hero.className = 'hero calm';
      heroIcon.textContent = '✅';
      heroTitle.textContent = 'Todo tranquilo';
      heroDesc.textContent = 'Nadie está esperando en la puerta.';
    }
  }

  ref.on('value', snapshot => {
    const val = snapshot.val() || {};
    lastList = Object.entries(val)
      .map(([id, a]) => ({ id, ...a }))
      .sort((a, b) => b.createdAt - a.createdAt);

    render();

    const activeWaiting = lastList.find(a => a.status === 'waiting' && !ignoredIds.has(a.id) && (Date.now() - a.createdAt) < 10 * 60 * 1000);
    if (activeWaiting) {
      showOverlay(activeWaiting.id, activeWaiting.createdAt);
    } else {
      hideOverlay();
    }
  });

  // Refresca los "hace X min" sin esperar un cambio en la base de datos.
  setInterval(render, 30000);

  window.__assign = assign;
  window.__attend = markAttended;
}
</script>
</body>
</html>
